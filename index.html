<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>سينمانا | Cinemana</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #121218;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --accent: #e50914;
            --accent-hover: #ff0f1f;
            --accent-gradient: linear-gradient(135deg, #e50914, #ff4b4b);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b8;
            --text-muted: #808088;
            --rating-star: #ffd700;
            --card-radius: 12px;
            --modal-radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100, 100, 200, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(50, 50, 100, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-sm);
            margin-top: 20px;
            padding: 15px 25px;
            position: sticky;
            top: 15px;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 10px 20px;
            flex: 1;
            max-width: 400px;
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.25);
            background: var(--glass-hover);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            width: 100%;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            border-radius: var(--modal-radius);
            overflow: hidden;
            min-height: 500px;
            margin: 25px 0;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            cursor: pointer;
        }

        .hero-backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.5) saturate(1.1);
            transition: transform 0.5s ease;
        }

        .hero-section:hover .hero-backdrop {
            transform: scale(1.03);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(10, 10, 15, 0.95) 0%,
                rgba(10, 10, 15, 0.7) 40%,
                rgba(10, 10, 15, 0.3) 100%
            );
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .hero-content {
            max-width: 700px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .hero-rating {
            color: var(--rating-star);
            font-weight: 600;
        }

        .hero-date {
            color: var(--text-secondary);
        }

        .hero-content p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 35px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.5);
        }

        /* Movie Grid */
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 30px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 5px;
            height: 30px;
            background: var(--accent-gradient);
            border-radius: 10px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .movie-card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            aspect-ratio: 2/3;
            will-change: transform;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(229, 9, 20, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .movie-card:active {
            transform: scale(0.98);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }

        .movie-card:hover img {
            filter: brightness(0.7);
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.95) 0%,
                rgba(0, 0, 0, 0.6) 50%,
                transparent 100%
            );
            transform: translateY(100%);
            transition: var(--transition);
        }

        .movie-card:hover .movie-info {
            transform: translateY(0);
        }

        .movie-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating-display {
            color: var(--rating-star);
            font-size: 0.85rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--modal-radius);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-backdrop {
            position: relative;
            height: 400px;
            border-radius: var(--modal-radius) var(--modal-radius) 0 0;
            overflow: hidden;
        }

        .modal-backdrop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-backdrop::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-secondary) 0%, transparent 50%);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-body h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .modal-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .modal-rating {
            color: var(--rating-star);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .modal-year {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .modal-overview {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        /* Player Modal */
        .player-modal .modal-content {
            max-width: 1000px;
            background: #000;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--glass-border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .player-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .server-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .server-btn {
            padding: 8px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .server-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
        }

        .server-btn.active {
            background: var(--accent-gradient);
            border-color: var(--accent);
        }

        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error Message */
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .error-message .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }

            .logo {
                justify-content: center;
                font-size: 1.5rem;
            }

            .search-box {
                max-width: 100%;
            }

            .hero-section {
                min-height: 350px;
            }

            .hero-overlay {
                padding: 20px;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .modal-backdrop {
                height: 250px;
            }

            .modal-body h2 {
                font-size: 1.4rem;
            }

            .player-header {
                flex-direction: column;
                align-items: stretch;
            }

            .server-buttons {
                justify-content: center;
            }
        }

        @media (max-width: 400px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }

            .hero-content h1 {
                font-size: 1.5rem;
            }

            .btn-primary {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                سينمانا
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." autocomplete="off">
            </div>
        </nav>

        <!-- Hero Section -->
        <div id="heroSection" class="hero-section" style="display: none;">
            <div class="hero-backdrop" id="heroBackdrop"></div>
            <div class="hero-overlay">
                <div class="hero-content">
                    <h1 id="heroTitle"></h1>
                    <div class="hero-meta">
                        <span class="hero-rating" id="heroRating"></span>
                        <span class="hero-date" id="heroDate"></span>
                    </div>
                    <p id="heroOverview"></p>
                    <button class="btn-primary" id="heroWatchBtn">
                        ▶ شاهد الآن
                    </button>
                </div>
            </div>
        </div>

        <!-- Movie Grid -->
        <h2 class="section-title" id="gridTitle">الأفلام الشائعة</h2>
        <div class="movie-grid" id="movieGrid">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div class="modal-overlay" id="movieModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeMovieModal()">✕</button>
            <div class="modal-backdrop" id="modalBackdrop">
                <img src="" alt="" id="modalBackdropImg">
            </div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <div class="modal-meta">
                    <span class="modal-rating" id="modalRating"></span>
                    <span class="modal-year" id="modalYear"></span>
                </div>
                <p class="modal-overview" id="modalOverview"></p>
                <button class="btn-primary" id="modalWatchBtn">
                    🎬 شاهد الآن
                </button>
            </div>
        </div>
    </div>

    <!-- Player Modal -->
    <div class="modal-overlay player-modal" id="playerModal">
        <div class="modal-content">
            <div class="player-header">
                <button class="modal-close" onclick="closePlayerModal()" style="position: static;">✕</button>
                <span class="player-title" id="playerTitle">المشغل</span>
                <div class="server-buttons" id="serverButtons">
                    <!-- Server buttons will be generated here -->
                </div>
            </div>
            <div class="player-container">
                <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const TMDB_API_KEY = 'f131da87533861d05eff315e68c09b28';
        const TMDB_ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJmMTMxZGE4NzUzMzg2MWQwNWVmZjMxNWU2OGMwOWIyOCIsIm5iZiI6MTc4NjcxMjI3NC44NjgsInN1YiI6IjZhN2YxMGQyNzBiY2Q3MDdhZmJmOTE4MSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.EtjmmFfCkuuJ9djdpRKvq-WHA3ZMReR2TvUVl0FyGfs';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
        const TMDB_IMAGE_ORIGINAL = 'https://image.tmdb.org/t/p/original';

        // Server configurations
        const servers = [
            { id: 1, name: 'سيرفر 1', url: 'https://vidsrc.xyz/embed/movie?tmdb=' },
            { id: 2, name: 'سيرفر 2', url: 'https://vidsrc.me/embed/movie?tmdb=' },
            { id: 3, name: 'سيرفر 3', url: 'https://embed.su/embed/movie/' },
            { id: 4, name: 'سيرفر 4', url: 'https://multiembed.mov/?video_id=' },
            { id: 5, name: 'سيرفر 5', url: 'https://moviesapi.club/movie/' }
        ];

        let currentMovies = [];
        let currentMovie = null;
        let currentServer = 0;
        let searchTimeout = null;

        // DOM Elements
        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const heroSection = document.getElementById('heroSection');
        const gridTitle = document.getElementById('gridTitle');
        const movieModal = document.getElementById('movieModal');
        const playerModal = document.getElementById('playerModal');
        const playerFrame = document.getElementById('playerFrame');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTrendingMovies();
            setupSearch();
            setupModalClose();
        });

        async function fetchTMDB(endpoint) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${TMDB_ACCESS_TOKEN}`,
                        'Content-Type': 'application/json;charset=utf-8'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        async function loadTrendingMovies() {
            try {
                const data = await fetchTMDB('/trending/movie/week?language=ar-SA&page=1');
                
                if (data.results && data.results.length > 0) {
                    currentMovies = data.results;
                    displayHeroMovie(data.results[0]);
                    displayMovies(data.results);
                } else {
                    showError('لا توجد أفلام متاحة حالياً');
                }
            } catch (error) {
                showError('حدث خطأ في تحميل الأفلام. تأكد من اتصالك بالإنترنت.');
            }
        }

        function displayHeroMovie(movie) {
            if (!movie) return;
            
            heroSection.style.display = 'block';
            
            const backdropUrl = movie.backdrop_path 
                ? `${TMDB_IMAGE_ORIGINAL}${movie.backdrop_path}`
                : `${TMDB_IMAGE_ORIGINAL}${movie.poster_path}`;
            document.getElementById('heroBackdrop').style.backgroundImage = `url('${backdropUrl}')`;
            
            document.getElementById('heroTitle').textContent = movie.title || movie.name || 'فيلم';
            
            const rating = Math.round(movie.vote_average * 10) / 10;
            const stars = '★'.repeat(Math.round(movie.vote_average / 2)) + '☆'.repeat(5 - Math.round(movie.vote_average / 2));
            document.getElementById('heroRating').innerHTML = `${stars} (${rating})`;
            
            const releaseDate = movie.release_date || movie.first_air_date || '';
            document.getElementById('heroDate').textContent = releaseDate ? `📅 ${releaseDate}` : '';
            
            document.getElementById('heroOverview').textContent = movie.overview || 'لا توجد قصة متاحة';
            
            document.getElementById('heroWatchBtn').onclick = () => showMovieDetails(movie);
            heroSection.onclick = () => showMovieDetails(movie);
        }

        function displayMovies(movies) {
            if (!movies || movies.length === 0) {
                showError('لا توجد نتائج');
                return;
            }

            movieGrid.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                
                const posterPath = movie.poster_path 
                    ? `${TMDB_IMAGE_BASE}${movie.poster_path}`
                    : 'https://via.placeholder.com/500x750?text=No+Image';
                
                const rating = Math.round(movie.vote_average * 10) / 10;
                const stars = '★'.repeat(Math.round(movie.vote_average / 2)) + '☆'.repeat(5 - Math.round(movie.vote_average / 2));
                
                card.innerHTML = `
                    <img src="${posterPath}" alt="${movie.title || movie.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                    <div class="movie-info">
                        <h3>${movie.title || movie.name}</h3>
                        <div class="rating-display">${stars} (${rating})</div>
                    </div>
                `;
                
                card.addEventListener('click', () => showMovieDetails(movie));
                
                movieGrid.appendChild(card);
            });
        }

        function showMovieDetails(movie) {
            currentMovie = movie;
            
            // Set modal content
            const backdropUrl = movie.backdrop_path 
                ? `${TMDB_IMAGE_ORIGINAL}${movie.backdrop_path}`
                : `${TMDB_IMAGE_ORIGINAL}${movie.poster_path}`;
            
            document.getElementById('modalBackdropImg').src = backdropUrl;
            document.getElementById('modalTitle').textContent = movie.title || movie.name;
            
            const rating = Math.round(movie.vote_average * 10) / 10;
            const stars = '★'.repeat(Math.round(movie.vote_average / 2)) + '☆'.repeat(5 - Math.round(movie.vote_average / 2));
            document.getElementById('modalRating').innerHTML = `${stars} (${rating})`;
            
            const releaseDate = movie.release_date || movie.first_air_date || '';
            document.getElementById('modalYear').textContent = releaseDate ? `سنة الإصدار: ${releaseDate}` : '';
            
            document.getElementById('modalOverview').textContent = movie.overview || 'لا توجد قصة متاحة لهذا الفيلم';
            
            document.getElementById('modalWatchBtn').onclick = () => openPlayer(movie);
            
            movieModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function openPlayer(movie) {
            if (!movie) return;
            
            currentMovie = movie;
            currentServer = 0;
            
            document.getElementById('playerTitle').textContent = `مشاهدة: ${movie.title || movie.name}`;
            
            // Generate server buttons
            const serverButtons = document.getElementById('serverButtons');
            serverButtons.innerHTML = '';
            
            servers.forEach((server, index) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (index === 0 ? ' active' : '');
                btn.textContent = server.name;
                btn.onclick = () => switchServer(index);
                serverButtons.appendChild(btn);
            });
            
            // Load first server
            loadServer(0);
            
            // Close movie modal and open player modal
            movieModal.classList.remove('active');
            playerModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function switchServer(index) {
            currentServer = index;
            
            // Update active button
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            loadServer(index);
        }

        function loadServer(index) {
            if (!currentMovie || !currentMovie.id) return;
            
            const movieId = currentMovie.id;
            let url = '';
            
            switch(index) {
                case 0: // vidsrc.xyz
                    url = `https://vidsrc.xyz/embed/movie?tmdb=${movieId}`;
                    break;
                case 1: // vidsrc.me
                    url = `https://vidsrc.me/embed/movie?tmdb=${movieId}`;
                    break;
                case 2: // embed.su
                    url = `https://embed.su/embed/movie/${movieId}`;
                    break;
                case 3: // multiembed.mov
                    url = `https://multiembed.mov/?video_id=${movieId}&tmdb=1`;
                    break;
                case 4: // moviesapi.club
                    url = `https://moviesapi.club/movie/${movieId}`;
                    break;
                default:
                    url = `https://vidsrc.xyz/embed/movie?tmdb=${movieId}`;
            }
            
            playerFrame.src = url;
        }

        function closeMovieModal() {
            movieModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function closePlayerModal() {
            playerModal.classList.remove('active');
            playerFrame.src = '';
            document.body.style.overflow = '';
        }

        function setupModalClose() {
            // Close modals when clicking outside
            movieModal.addEventListener('click', (e) => {
                if (e.target === movieModal) {
                    closeMovieModal();
                }
            });
            
            playerModal.addEventListener('click', (e) => {
                if (e.target === playerModal) {
                    closePlayerModal();
                }
            });
            
            // Close modals with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (playerModal.classList.contains('active')) {
                        closePlayerModal();
                    } else if (movieModal.classList.contains('active')) {
                        closeMovieModal();
                    }
                }
            });
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                
                if (query.length === 0) {
                    gridTitle.textContent = 'الأفلام الشائعة';
                    loadTrendingMovies();
                    return;
                }
                
                searchTimeout = setTimeout(() => {
                    searchMovies(query);
                }, 500);
            });
        }

        async function searchMovies(query) {
            movieGrid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
            gridTitle.textContent = `نتائج البحث عن: "${query}"`;
            
            try {
                const data = await fetchTMDB(`/search/movie?language=ar-SA&query=${encodeURIComponent(query)}&page=1&include_adult=false`);
                
                if (data.results && data.results.length > 0) {
                    currentMovies = data.results;
                    displayHeroMovie(data.results[0]);
                    displayMovies(data.results);
                } else {
                    showError(`لا توجد نتائج للبحث عن "${query}"`);
                }
            } catch (error) {
                showError('حدث خطأ في البحث');
            }
        }

        function showError(message) {
            movieGrid.innerHTML = `
                <div class="error-message">
                    <div class="icon">🎬</div>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
