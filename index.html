<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>عراق تي في | Iraq TV</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #121218;
            --bg-tertiary: #1a1a22;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --accent: #e50914;
            --accent-hover: #ff0f1f;
            --accent-gradient: linear-gradient(135deg, #e50914, #ff4b4b);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b8;
            --text-muted: #808088;
            --rating-star: #ffd700;
            --card-radius: 12px;
            --modal-radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100, 100, 200, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(50, 50, 100, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-sm);
            margin-top: 20px;
            padding: 15px 25px;
            position: sticky;
            top: 15px;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            max-width: 600px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 10px 20px;
            flex: 1;
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.25);
            background: var(--glass-hover);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            width: 100%;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .menu-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .menu-btn:hover {
            background: var(--glass-hover);
            transform: scale(1.1);
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 60px;
            left: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-lg);
            min-width: 200px;
            display: none;
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown-menu.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .dropdown-item:hover {
            background: var(--glass-hover);
            padding-right: 25px;
        }

        .dropdown-item .icon {
            font-size: 1.2rem;
        }

        /* Hero Slider */
        .hero-slider {
            position: relative;
            margin: 25px 0;
            border-radius: var(--modal-radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            height: 500px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slider-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
            cursor: pointer;
        }

        .slider-slide.active {
            opacity: 1;
        }

        .slider-backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.5) saturate(1.1);
        }

        .slider-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(10, 10, 15, 0.95) 0%,
                rgba(10, 10, 15, 0.7) 40%,
                rgba(10, 10, 15, 0.3) 100%
            );
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .slider-content {
            max-width: 700px;
        }

        .slider-content h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .slider-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .slider-rating {
            color: var(--rating-star);
            font-weight: 600;
        }

        .slider-date {
            color: var(--text-secondary);
        }

        .slider-content p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .slider-nav:hover {
            background: var(--accent);
            transform: translateY(-50%) scale(1.1);
        }

        .slider-prev {
            right: 20px;
        }

        .slider-next {
            left: 20px;
        }

        .slider-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .slider-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
        }

        .slider-dot.active {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.3);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 35px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: 0 5px 20px rgba(229, 9, 20, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.5);
        }

        /* Categories */
        .category-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .category-tab {
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .category-tab:hover {
            background: var(--glass-hover);
        }

        .category-tab.active {
            background: var(--accent-gradient);
            border-color: var(--accent);
        }

        /* Sections */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px 0 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 5px;
            height: 30px;
            background: var(--accent-gradient);
            border-radius: 10px;
        }

        .btn-more {
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-more:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
        }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding-bottom: 20px;
        }

        .movie-card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            aspect-ratio: 2/3;
            will-change: transform;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(229, 9, 20, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }

        .movie-card:hover img {
            filter: brightness(0.7);
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.95) 0%,
                rgba(0, 0, 0, 0.6) 50%,
                transparent 100%
            );
            transform: translateY(100%);
            transition: var(--transition);
        }

        .movie-card:hover .movie-info {
            transform: translateY(0);
        }

        .movie-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating-display {
            color: var(--rating-star);
            font-size: 0.85rem;
        }

        /* Movie Details Page */
        .movie-details-page {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 1000;
            overflow-y: auto;
            display: none;
        }

        .movie-details-page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .details-backdrop {
            position: relative;
            height: 60vh;
            min-height: 400px;
        }

        .details-backdrop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .details-backdrop::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-primary) 0%, transparent 50%);
        }

        .details-back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .details-back-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        .details-content {
            padding: 0 40px 40px;
            margin-top: -100px;
            position: relative;
            z-index: 10;
        }

        .details-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .details-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .details-rating {
            color: var(--rating-star);
            font-weight: 700;
            font-size: 1.3rem;
        }

        .details-year {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .details-genres {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .genre-tag {
            padding: 8px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .details-overview {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 800px;
        }

        .server-section {
            margin-top: 30px;
        }

        .server-section h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .server-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .server-btn {
            padding: 12px 25px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
        }

        .server-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
        }

        .server-btn.active {
            background: var(--accent-gradient);
            border-color: var(--accent);
        }

        .player-embed {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .player-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error */
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .error-message .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }

            .logo {
                justify-content: center;
                font-size: 1.5rem;
            }

            .nav-actions {
                max-width: 100%;
            }

            .hero-slider {
                height: 350px;
            }

            .slider-overlay {
                padding: 20px;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .details-content {
                padding: 0 20px 20px;
            }

            .details-title {
                font-size: 1.8rem;
            }

            .section-title {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 400px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }

            .slider-content h1 {
                font-size: 1.5rem;
            }

            .btn-primary {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo" onclick="showHome()">
                <span class="logo-icon">📺</span>
                عراق تي في
            </div>
            <div class="nav-actions">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." autocomplete="off">
                </div>
                <div style="position: relative;">
                    <button class="menu-btn" onclick="toggleMenu()">⋮</button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" onclick="showMovies()">
                            <span class="icon">🎬</span>
                            أفلام
                        </div>
                        <div class="dropdown-item" onclick="showTVShows()">
                            <span class="icon">📺</span>
                            مسلسلات
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div id="homeContent">
            <!-- Hero Slider -->
            <div class="hero-slider" id="heroSlider">
                <div class="slider-container" id="sliderContainer"></div>
                <button class="slider-nav slider-prev" onclick="changeSlide(-1)">❮</button>
                <button class="slider-nav slider-next" onclick="changeSlide(1)">❯</button>
                <div class="slider-dots" id="sliderDots"></div>
            </div>

            <!-- Movies 2026 Section -->
            <div class="section-header">
                <h2 class="section-title">أفلام 2026</h2>
                <button class="btn-more" onclick="showAllMovies2026()">مشاهدة المزيد ←</button>
            </div>
            <div class="movie-grid" id="movies2026Grid"></div>

            <!-- Latest Movies Section -->
            <div class="section-header">
                <h2 class="section-title">أحدث الأفلام</h2>
                <button class="btn-more" onclick="showAllMovies()">مشاهدة المزيد ←</button>
            </div>
            <div class="movie-grid" id="latestMoviesGrid"></div>

            <!-- Top TV Shows Section -->
            <div class="section-header">
                <h2 class="section-title">أفضل المسلسلات</h2>
                <button class="btn-more" onclick="showAllTVShows()">مشاهدة المزيد ←</button>
            </div>
            <div class="movie-grid" id="topTVGrid"></div>
        </div>

        <!-- Movies Page -->
        <div id="moviesPage" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">جميع الأفلام</h2>
            </div>
            <div class="category-tabs" id="movieCategories"></div>
            <div class="movie-grid" id="allMoviesGrid"></div>
        </div>

        <!-- TV Shows Page -->
        <div id="tvPage" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">جميع المسلسلات</h2>
            </div>
            <div class="category-tabs" id="tvCategories"></div>
            <div class="movie-grid" id="allTVGrid"></div>
        </div>
    </div>

    <!-- Movie Details Page -->
    <div class="movie-details-page" id="movieDetailsPage">
        <div class="details-backdrop">
            <img src="" alt="" id="detailsBackdrop">
            <button class="details-back-btn" onclick="closeDetails()">✕</button>
        </div>
        <div class="details-content">
            <h1 class="details-title" id="detailsTitle"></h1>
            <div class="details-meta">
                <span class="details-rating" id="detailsRating"></span>
                <span class="details-year" id="detailsYear"></span>
            </div>
            <div class="details-genres" id="detailsGenres"></div>
            <p class="details-overview" id="detailsOverview"></p>
            
            <div class="server-section">
                <h3>🎬 سيرفرات المشاهدة</h3>
                <div class="server-buttons" id="serverButtons"></div>
                <div class="player-embed">
                    <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const TMDB_API_KEY = 'f131da87533861d05eff315e68c09b28';

        async function fetchTMDB(endpoint) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}${endpoint}`, {
                    headers: {
                        'Authorization': `Bearer ${TMDB_ACCESS_TOKEN}`,
                        'Content-Type': 'application/json;charset=utf-8'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        async function loadAllData() {
            try {
                // Load trending movies for slider
                const trendingData = await fetchTMDB('/trending/all/week?language=ar-SA&page=1');
                if (trendingData.results && trendingData.results.length > 0) {
                    sliderMovies = trendingData.results.slice(0, 5);
                    displaySlider(sliderMovies);
                }

                // Load 2026 movies
                const movies2026Data = await fetchTMDB('/discover/movie?language=ar-SA&sort_by=popularity.desc&primary_release_year=2026&page=1');
                if (movies2026Data.results) {
                    displayMoviesInGrid('movies2026Grid', movies2026Data.results.slice(0, 6));
                }

                // Load latest movies
                const latestMoviesData = await fetchTMDB('/discover/movie?language=ar-SA&sort_by=release_date.desc&page=1');
                if (latestMoviesData.results) {
                    displayMoviesInGrid('latestMoviesGrid', latestMoviesData.results.slice(0, 6));
                }

                // Load top TV shows
                const topTVData = await fetchTMDB('/tv/top_rated?language=ar-SA&page=1');
                if (topTVData.results) {
                    displayTVInGrid('topTVGrid', topTVData.results.slice(0, 6));
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function displaySlider(movies) {
            const sliderContainer = document.getElementById('sliderContainer');
            const sliderDots = document.getElementById('sliderDots');
            sliderContainer.innerHTML = '';
            sliderDots.innerHTML = '';
            
            movies.forEach((movie, index) => {
                const slide = document.createElement('div');
                slide.className = 'slider-slide' + (index === 0 ? ' active' : '');
                
                const backdropUrl = movie.backdrop_path 
                    ? `${TMDB_IMAGE_ORIGINAL}${movie.backdrop_path}`
                    : `${TMDB_IMAGE_ORIGINAL}${movie.poster_path}`;
                
                const rating = Math.round(movie.vote_average * 10) / 10;
                const stars = '★'.repeat(Math.round(movie.vote_average / 2)) + '☆'.repeat(5 - Math.round(movie.vote_average / 2));
                const releaseDate = movie.release_date || movie.first_air_date || '';
                
                slide.innerHTML = `
                    <div class="slider-backdrop" style="background-image: url('${backdropUrl}')"></div>
                    <div class="slider-overlay">
                        <div class="slider-content">
                            <h1>${movie.title || movie.name}</h1>
                            <div class="slider-meta">
                                <span class="slider-rating">${stars} (${rating})</span>
                                <span class="slider-date">${releaseDate ? '📅 ' + releaseDate : ''}</span>
                            </div>
                            <p>${movie.overview || 'لا توجد قصة متاحة'}</p>
                            <button class="btn-primary" onclick="event.stopPropagation(); showMovieDetails(${movie.id}, '${movie.media_type || 'movie'}')">
                                ▶ شاهد الآن
                            </button>
                        </div>
                    </div>
                `;
                
                slide.addEventListener('click', () => showMovieDetails(movie.id, movie.media_type || 'movie'));
                sliderContainer.appendChild(slide);
                
                const dot = document.createElement('div');
                dot.className = 'slider-dot' + (index === 0 ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(index));
                sliderDots.appendChild(dot);
            });
        }

        function displayMoviesInGrid(gridId, movies) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            
            movies.forEach(movie => {
                const card = createMovieCard(movie, 'movie');
                grid.appendChild(card);
            });
        }

        function displayTVInGrid(gridId, shows) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            
            shows.forEach(show => {
                const card = createMovieCard(show, 'tv');
                grid.appendChild(card);
            });
        }

        function createMovieCard(item, type) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            
            const posterPath = item.poster_path 
                ? `${TMDB_IMAGE_BASE}${item.poster_path}`
                : 'https://via.placeholder.com/500x750?text=No+Image';
            
            const rating = Math.round(item.vote_average * 10) / 10;
            const stars = '★'.repeat(Math.round(item.vote_average / 2)) + '☆'.repeat(5 - Math.round(item.vote_average / 2));
            
            card.innerHTML = `
                <img src="${posterPath}" alt="${item.title || item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                <div class="movie-info">
                    <h3>${item.title || item.name}</h3>
                    <div class="rating-display">${stars} (${rating})</div>
                </div>
            `;
            
            card.addEventListener('click', () => showMovieDetails(item.id, type));
            
            return card;
        }

        function changeSlide(direction) {
            const slides = document.querySelectorAll('.slider-slide');
            if (slides.length === 0) return;
            
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            
            updateDots();
            resetSliderInterval();
        }

        function goToSlide(index) {
            const slides = document.querySelectorAll('.slider-slide');
            if (slides.length === 0) return;
            
            slides[currentSlide].classList.remove('active');
            currentSlide = index;
            slides[currentSlide].classList.add('active');
            
            updateDots();
            resetSliderInterval();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.slider-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }

        function startSlider() {
            sliderInterval = setInterval(() => {
                changeSlide(1);
            }, 5000);
        }

        function resetSliderInterval() {
            clearInterval(sliderInterval);
            startSlider();
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('active');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdownMenu');
            const menuBtn = document.querySelector('.menu-btn');
            if (menu && menuBtn && !menuBtn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.remove('active');
            }
        });

        function showHome() {
            document.getElementById('homeContent').style.display = 'block';
            document.getElementById('moviesPage').style.display = 'none';
            document.getElementById('tvPage').style.display = 'none';
            currentPage = 'home';
        }

        function showMovies() {
            document.getElementById('homeContent').style.display = 'none';
            document.getElementById('moviesPage').style.display = 'block';
            document.getElementById('tvPage').style.display = 'none';
            currentPage = 'movies';
            document.getElementById('dropdownMenu').classList.remove('active');
            loadAllMovies();
        }

        function showTVShows() {
            document.getElementById('homeContent').style.display = 'none';
            document.getElementById('moviesPage').style.display = 'none';
            document.getElementById('tvPage').style.display = 'block';
            currentPage = 'tv';
            document.getElementById('dropdownMenu').classList.remove('active');
            loadAllTVShows();
        }

        async function loadAllMovies() {
            try {
                const grid = document.getElementById('allMoviesGrid');
                grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
                
                const data = await fetchTMDB('/discover/movie?language=ar-SA&sort_by=popularity.desc&page=1');
                if (data.results) {
                    displayMoviesInGrid('allMoviesGrid', data.results);
                }
                
                // Load categories
                loadMovieCategories();
            } catch (error) {
                console.error('Error loading movies:', error);
            }
        }

        async function loadAllTVShows() {
            try {
                const grid = document.getElementById('allTVGrid');
                grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
                
                const data = await fetchTMDB('/tv/popular?language=ar-SA&page=1');
                if (data.results) {
                    displayTVInGrid('allTVGrid', data.results);
                }
                
                // Load categories
                loadTVCategories();
            } catch (error) {
                console.error('Error loading TV shows:', error);
            }
        }

        function loadMovieCategories() {
            const categoriesDiv = document.getElementById('movieCategories');
            categoriesDiv.innerHTML = '';
            
            const mainGenres = [28, 35, 27, 878, 18, 53];
            const allTab = document.createElement('button');
            allTab.className = 'category-tab active';
            allTab.textContent = 'الكل';
            allTab.onclick = () => filterMoviesByGenre(null, allTab);
            categoriesDiv.appendChild(allTab);
            
            mainGenres.forEach(genreId => {
                const tab = document.createElement('button');
                tab.className = 'category-tab';
                tab.textContent = genres[genreId];
                tab.onclick = () => filterMoviesByGenre(genreId, tab);
                categoriesDiv.appendChild(tab);
            });
        }

        function loadTVCategories() {
            const categoriesDiv = document.getElementById('tvCategories');
            categoriesDiv.innerHTML = '';
            
            const mainGenres = [10759, 35, 18, 10765, 9648, 80];
            const allTab = document.createElement('button');
            allTab.className = 'category-tab active';
            allTab.textContent = 'الكل';
            allTab.onclick = () => filterTVByGenre(null, allTab);
            categoriesDiv.appendChild(allTab);
            
            mainGenres.forEach(genreId => {
                const tab = document.createElement('button');
                tab.className = 'category-tab';
                tab.textContent = genres[genreId] || 'نوع';
                tab.onclick = () => filterTVByGenre(genreId, tab);
                categoriesDiv.appendChild(tab);
            });
        }

        async function filterMoviesByGenre(genreId, tabElement) {
            // Update active tab
            document.querySelectorAll('#movieCategories .category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (tabElement) tabElement.classList.add('active');
            
            try {
                const grid = document.getElementById('allMoviesGrid');
                grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
                
                const endpoint = genreId 
                    ? `/discover/movie?language=ar-SA&with_genres=${genreId}&sort_by=popularity.desc&page=1`
                    : '/discover/movie?language=ar-SA&sort_by=popularity.desc&page=1';
                
                const data = await fetchTMDB(endpoint);
                if (data.results) {
                    displayMoviesInGrid('allMoviesGrid', data.results);
                }
            } catch (error) {
                console.error('Error filtering movies:', error);
            }
        }

        async function filterTVByGenre(genreId, tabElement) {
            // Update active tab
            document.querySelectorAll('#tvCategories .category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (tabElement) tabElement.classList.add('active');
            
            try {
                const grid = document.getElementById('allTVGrid');
                grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
                
                const endpoint = genreId 
                    ? `/discover/tv?language=ar-SA&with_genres=${genreId}&sort_by=popularity.desc&page=1`
                    : '/tv/popular?language=ar-SA&page=1';
                
                const data = await fetchTMDB(endpoint);
                if (data.results) {
                    displayTVInGrid('allTVGrid', data.results);
                }
            } catch (error) {
                console.error('Error filtering TV shows:', error);
            }
        }

            showMovies();

                const data = await fetchTMDB('/discover/movie?language=ar-SA&sort_by=popularity.desc&primary_release_year=2026&page=1');
                if (data.results) {
                    displayMoviesInGrid('allMoviesGrid', data.results);
                }
            } catch (error) {
                console.error('Error loading 2026 movies:', error);

        async function showAllMovies() {
            showMovies();
            await loadAllMovies();
        }

        async function showAllTVShows() {
            showTVShows();

        async function showMovieDetails(id, type) {
            try {
                const endpoint = type === 'tv' 
                    ? `/tv/${id}?language=ar-SA`
                    : `/movie/${id}?language=ar-SA`;
                
                const data = await fetchTMDB(endpoint);
                
                currentMovie = data;
                currentMovie.type = type;
                
                // Set backdrop
                const backdropUrl = data.backdrop_path 
                    ? `${TMDB_IMAGE_ORIGINAL}${data.backdrop_path}`
                    : `${TMDB_IMAGE_ORIGINAL}${data.poster_path}`;
                document.getElementById('detailsBackdrop').src = backdropUrl;
                
                // Set title
                document.getElementById('detailsTitle').textContent = data.title || data.name;
                
                // Set rating
                const rating = Math.round(data.vote_average * 10) / 10;
                const stars = '★'.repeat(Math.round(data.vote_average / 2)) + '☆'.repeat(5 - Math.round(data.vote_average / 2));
                document.getElementById('detailsRating').innerHTML = `${stars} (${rating})`;
                
                // Set year
                const releaseDate = data.release_date || data.first_air_date || '';
                document.getElementById('detailsYear').textContent = releaseDate ? `📅 ${releaseDate}` : '';
                
                // Set genres
                const genresDiv = document.getElementById('detailsGenres');
                genresDiv.innerHTML = '';
                if (data.genres) {
                    data.genres.forEach(genre => {
                        const tag = document.createElement('span');
                        tag.className = 'genre-tag';
                        tag.textContent = genre.name;
                        genresDiv.appendChild(tag);
                    });
                }
                
                // Set overview
                document.getElementById('detailsOverview').textContent = data.overview || 'لا توجد قصة متاحة';
                
                // Setup servers
                setupServers(id, type);
                
                // Show details page
                movieDetailsPage.classList.add('active');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                console.error('Error loading movie details:', error);
            }
        }

        function setupServers(id, type) {
            const serverButtons = document.getElementById('serverButtons');
            serverButtons.innerHTML = '';
            
            servers.forEach((server, index) => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (index === 0 ? ' active' : '');
                btn.textContent = server.name;
                btn.onclick = () => switchServer(index);
                serverButtons.appendChild(btn);
            });
            
            // Load first server
            switchServer(0);
        }

        function switchServer(index) {
            currentServer = index;
            
            // Update active button
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            if (!currentMovie || !currentMovie.id) return;
            
            const movieId = currentMovie.id;
            const type = currentMovie.type || 'movie';
            let url = '';
            
            switch(index) {
                case 0:
                    url = `https://vidsrc.xyz/embed/${type}?tmdb=${movieId}`;
                    break;
                case 1:
                    url = `https://vidsrc.me/embed/${type}?tmdb=${movieId}`;
                    break;
                case 2:
                    url = `https://embed.su/embed/${type}/${movieId}`;
                    break;
                case 3:
                    url = `https://multiembed.mov/?video_id=${movieId}&tmdb=1`;
                    break;
                case 4:
                    url = `https://moviesapi.club/${type}/${movieId}`;
                    break;
                default:
                    url = `https://vidsrc.xyz/embed/${type}?tmdb=${movieId}`;
            }
            
            document.getElementById('playerFrame').src = url;
        }

        function closeDetails() {
            movieDetailsPage.classList.remove('active');
            document.getElementById('playerFrame').src = '';
            document.body.style.overflow = '';
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                
                if (query.length === 0) {
                    showHome();
                    loadAllData();
                    return;
                }
                
                searchTimeout = setTimeout(() => {
                    searchMovies(query);
                }, 500);
            });
        }

        async function searchMovies(query) {
            try {
                const grid = document.getElementById('allMoviesGrid');
                grid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
                
                showMovies();
                
                const data = await fetchTMDB(`/search/multi?language=ar-SA&query=${encodeURIComponent(query)}&page=1&include_adult=false`);
                
                if (data.results && data.results.length > 0) {
                    displayMoviesInGrid('allMoviesGrid', data.results);
                } else {
                    grid.innerHTML = `
                        <div class="error-message">
                            <div class="icon">🔍</div>
                            <p>لا توجد نتائج للبحث عن "${query}"</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error searching:', error);
            }
        }
    </script>
