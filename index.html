<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عراق تي في | IraqTV</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
    </div>

    <nav class="navbar">
        <div class="logo" onclick="showHome()">📺 عراق تي في</div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
        </div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item" onclick="showHome()">🏠 الرئيسية</div>
            <div class="dropdown-item" onclick="showMovies()">🎬 أفلام</div>
            <div class="dropdown-item" onclick="showSeries()">📺 مسلسلات</div>
            <div class="dropdown-item" onclick="showFavorites()">❤️ المفضلة</div>
            <div class="dropdown-item" onclick="window.location.href='admin.html'">🔐 لوحة التحكم</div>
        </div>
    </nav>

    <div class="hero-slider" id="heroSlider"></div>

    <div class="section">
        <div class="section-header">
            <h2>🔥 الأكثر مشاهدة</h2>
        </div>
        <div class="movie-grid" id="trendingGrid"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>🎬 أحدث الأفلام</h2>
            <button onclick="showMovies()">المزيد</button>
        </div>
        <div class="movie-grid" id="moviesGrid"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>📺 أحدث المسلسلات</h2>
            <button onclick="showSeries()">المزيد</button>
        </div>
        <div class="movie-grid" id="seriesGrid"></div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <button class="close-btn" onclick="closePlayer()">✕</button>
            <div class="player-title" id="playerTitle">اسم الفيلم</div>
        </div>
        <div class="server-tabs" id="serverTabs"></div>
        <div class="episode-selector" id="episodeSelector"></div>
        <div class="player-container">
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
