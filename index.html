<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>سينما زجاجية | Glass Cinema</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #e50914;
            --accent-hover: #ff0f1f;
            --text-primary: #ffffff;
            --text-secondary: #c0c0c8;
            --rating-star: #ffd700;
            --card-radius: 16px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tajawal', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100, 100, 200, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(50, 50, 100, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 0;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--glass-shadow);
            margin-top: 20px;
            padding: 15px 25px;
            position: sticky;
            top: 15px;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #e50914, #ff6b6b, #e50914);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoShine 4s ease-in-out infinite;
        }

        @keyframes logoShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 10px 20px;
            min-width: 250px;
            flex: 1;
            max-width: 450px;
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            width: 100%;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .search-box .search-icon {
            color: var(--text-secondary);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            min-height: 550px;
            margin: 25px 0;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .hero-backdrop {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.45) saturate(1.1);
            transition: transform 0.6s ease;
            will-change: transform;
        }

        .hero-section:hover .hero-backdrop {
            transform: scale(1.02);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(10, 10, 15, 0.95) 0%,
                rgba(10, 10, 15, 0.6) 40%,
                rgba(10, 10, 15, 0.2) 100%
            );
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .hero-content {
            max-width: 700px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            letter-spacing: -0.5px;
        }

        .hero-content .hero-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--rating-star);
            font-weight: 600;
        }

        .hero-date {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .hero-content p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .btn-watch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 35px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-watch:hover {
            background: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.45);
        }

        /* Movie Grid */
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 40px 0 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .section-title::before {
            content: '';
            width: 5px;
            height: 30px;
            background: var(--accent);
            border-radius: 10px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .movie-card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            aspect-ratio: 2/3;
            will-change: transform;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: rgba(229, 9, 20, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(229, 9, 20, 0.15);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }

        .movie-card:hover img {
            filter: brightness(0.7);
        }

        .movie-card .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.95) 0%,
                rgba(0, 0, 0, 0.7) 50%,
                transparent 100%
            );
            transform: translateY(100%);
            transition: var(--transition);
        }

        .movie-card:hover .movie-info {
            transform: translateY(0);
        }

        .movie-card .movie-info h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-card .movie-info .rating-display {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--rating-star);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .movie-card .movie-info .rating-display .stars {
            letter-spacing: 2px;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            color: var(--text-secondary);
        }

        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }

            .logo {
                text-align: center;
                font-size: 1.7rem;
            }

            .search-box {
                max-width: 100%;
                min-width: auto;
            }

            .hero-section {
                min-height: 400px;
            }

            .hero-overlay {
                padding: 25px 20px;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .btn-watch {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }

        @media (max-width: 400px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .hero-content h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo">🎬 سينما زجاجية</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم..." autocomplete="off">
            </div>
        </nav>

        <!-- Hero Section -->
        <div id="heroSection" class="hero-section" style="display: none;">
            <div class="hero-backdrop" id="heroBackdrop"></div>
            <div class="hero-overlay">
                <div class="hero-content" id="heroContent">
                    <h1 id="heroTitle"></h1>
                    <div class="hero-meta">
                        <span class="hero-rating" id="heroRating"></span>
                        <span class="hero-date" id="heroDate"></span>
                    </div>
                    <p id="heroOverview"></p>
                    <button class="btn-watch" onclick="playMovie()">
                        ▶ شاهد الآن
                    </button>
                </div>
            </div>
        </div>

        <!-- Movie Grid Section -->
        <h2 class="section-title" id="gridTitle">الأفلام الشائعة</h2>
        <div class="movie-grid" id="movieGrid">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const TMDB_API_KEY = 'f131da87533861d05eff315e68c09b28';
        const TMDB_ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJmMTMxZGE4NzUzMzg2MWQwNWVmZjMxNWU2OGMwOWIyOCIsIm5iZiI6MTc4NjcxMjI3NC44NjgsInN1YiI6IjZhN2YxMGQyNzBiY2Q3MDdhZmJmOTE4MSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.EtjmmFfCkuuJ9djdpRKvq-WHA3ZMReR2TvUVl0FyGfs';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const TMDB_IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
        const TMDB_IMAGE_ORIGINAL = 'https://image.tmdb.org/t/p/original';

        let currentMovies = [];
        let searchTimeout = null;

        // DOM Elements
        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const heroSection = document.getElementById('heroSection');
        const gridTitle = document.getElementById('gridTitle');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTrendingMovies();
            setupSearch();
        });

        async function fetchTMDB(endpoint) {
            const response = await fetch(`${TMDB_BASE_URL}${endpoint}`, {
                headers: {
                    'Authorization': `Bearer ${TMDB_ACCESS_TOKEN}`,
                    'Content-Type': 'application/json;charset=utf-8'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            return await response.json();
        }

        async function loadTrendingMovies() {
            try {
                const data = await fetchTMDB('/discover/movie?language=ar-SA&sort_by=popularity.desc&page=1');

                
                if (data.results && data.results.length > 0) {
                    currentMovies = data.results;
                    displayHeroMovie(data.results[0]);
                    displayMovies(data.results);
                } else {
                    showEmptyState('لا توجد أفلام متاحة حالياً');
                }
            } catch (error) {
                console.error('Error loading trending movies:', error);
                showEmptyState('حدث خطأ في تحميل الأفلام. تأكد من اتصالك بالإنترنت.');
            }
        }

        function displayHeroMovie(movie) {
            if (!movie) return;
            
            heroSection.style.display = 'block';
            
            // Set backdrop
            const backdropUrl = movie.backdrop_path 
                ? `${TMDB_IMAGE_ORIGINAL}${movie.backdrop_path}`
                : `${TMDB_IMAGE_ORIGINAL}${movie.poster_path}`;
            document.getElementById('heroBackdrop').style.backgroundImage = `url('${backdropUrl}')`;
            
            // Set content
            document.getElementById('heroTitle').textContent = movie.title || movie.name || 'فيلم';
            
            const rating = Math.round(movie.vote_average * 10) / 10;
            const stars = '★'.repeat(Math.round(movie.vote_average / 2)) + '☆'.repeat(5 - Math.round(movie.vote_average / 2));
            document.getElementById('heroRating').innerHTML = `${stars} (${rating})`;
            
            const releaseDate = movie.release_date || movie.first_air_date || '';
            document.getElementById('heroDate').textContent = releaseDate ? `📅 ${releaseDate}` : '';
            
            const overview = movie.overview || 'لا توجد قصة متاحة لهذا الفيلم';
            document.getElementById('heroOverview').textContent = overview;
        }

        function displayMovies(movies) {
            if (!movies || movies.length === 0) {
                showEmptyState('لا توجد نتائج');
                return;
            }

            movieGrid.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                
                const posterPath = movie.poster_path 
                    ? `${TMDB_IMAGE_BASE}${movie.poster_path}`
                    : 'https://via.placeholder.com/500x750?text=No+Image';
                
                const rating = Math.round(movie.vote_average * 10) / 10;
                const stars = '★'.repeat(Math.round(movie.vote_average / 2)) + '☆'.repeat(5 - Math.round(movie.vote_average / 2));
                
                card.innerHTML = `
                    <img src="${posterPath}" alt="${movie.title || movie.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                    <div class="movie-info">
                        <h3>${movie.title || movie.name}</h3>
                        <div class="rating-display">
                            <span class="stars">${stars}</span>
                            <span>(${rating})</span>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => {
    // فتح مشغل الفيلم مع سيرفرات المشاهدة المباشرة
    openMoviePlayer(movie);
});          
                
                movieGrid.appendChild(card);
            });
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                
                if (query.length === 0) {
                    gridTitle.textContent = 'الأفلام الشائعة';
                    loadTrendingMovies();
                    return;
                }
                
                searchTimeout = setTimeout(() => {
                    searchMovies(query);
                }, 500);
            });
        }

        async function searchMovies(query) {
            movieGrid.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
            gridTitle.textContent = `نتائج البحث عن: "${query}"`;
            
            try {
                const data = await fetchTMDB(`/search/movie?language=ar-SA&query=${encodeURIComponent(query)}&page=1&include_adult=false`);
                
                if (data.results && data.results.length > 0) {
                    currentMovies = data.results;
                    displayHeroMovie(data.results[0]);
                    displayMovies(data.results);
                } else {
                    showEmptyState(`لا توجد نتائج للبحث عن "${query}"`);
                }
            } catch (error) {
                console.error('Error searching movies:', error);
                showEmptyState('حدث خطأ في البحث');
            }
        }

        function showEmptyState(message) {
            movieGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🎬</div>
                    <p>${message}</p>
                </div>
            `;
        }

        function playMovie() {
            alert('سيتم تشغيل الفيلم قريباً! هذا عرض تجريبي.');
        }
    </// دالة فتح مشغل الفيلم وسيرفرات المشاهدة
function openMoviePlayer(movie) {
    const movieId = movie.id;
    const movieTitle = movie.title || movie.name;
    
    // تغيير واجهة الهيرو لعرض الفيلم المختار مع زر المشاهدة الفعلية
    displayHeroMovie(movie);
    heroSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    
    // تحديث زر "شاهد الآن" لفتح مشغل سحابي حقيقي (Embed Player)
    const watchBtn = document.querySelector('.btn-watch');
    if (watchBtn) {
        watchBtn.onclick = () => {
            // نافذة مشغل سحابي جاهزة تعرض الفيلم عبر معرف TMDB مباشرة
            const playerWindow = window.open('', '_blank');
            playerWindow.document.write(`
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>مشاهدة فيلم: ${movieTitle}</title>
                    <style>
                        body { margin: 0; background: #000; color: #fff; font-family: Tahoma, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                        header { background: #111; padding: 15px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; }
                        .player-container { flex: 1; width: 100%; height: 100%; }
                        iframe { width: 100%; height: 100%; border: none; }
                    </style>
                </head>
                <body>
                    <header>🎬 جارِ تشغيل: ${movieTitle}</header>
                    <div class="player-container">
                        <!-- مشغل سحابي مجاني وسريع يعتمد على معرف الفيلم -->
                        <iframe src="https://vidsrc.xyz/embed/movie?tmdb=${movieId}" allowfullscreen></iframe>
                    </div>
                </body>
                </html>
            `);
        };
    }
}
script>
</body>
</html>
