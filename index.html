<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>عراق تي في | Iraq TV - منصة المشاهدة السينمائية</title>
    <meta name="description" content="عراق تي في - منصة عراقية لمشاهدة الأفلام والمسلسلات بجودة عالية">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Loading Bar -->
    <div class="loading-bar" id="loadingBar"></div>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick="showSection('home')">
                <span class="logo-icon">📺</span>
                <span class="logo-text">عراق تي في</span>
            </a>
            
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن فيلم، مسلسل، أو ممثل..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
            </div>
            
            <nav class="nav-links">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <div class="menu-dropdown" id="menuDropdown">
                    <a href="#" onclick="showSection('home')">🏠 الرئيسية</a>
                    <a href="#" onclick="showSection('movies')">🎬 أفلام</a>
                    <a href="#" onclick="showSection('series')">📺 مسلسلات</a>
                    <a href="#" onclick="showSection('favorites')">❤️ المفضلة</a>
                    <a href="#" onclick="openAdminPanel()">🔐 لوحة التحكم</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Slider -->
    <section class="hero-slider" id="heroSlider">
        <div class="hero-container" id="heroContainer"></div>
        <button class="hero-nav prev" onclick="changeHero(-1)">❮</button>
        <button class="hero-nav next" onclick="changeHero(1)">❯</button>
        <div class="hero-dots" id="heroDots"></div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Trending Section -->
        <section class="content-section" id="trendingSection">
            <div class="section-header">
                <h2 class="section-title">🔥 الأكثر مشاهدة</h2>
                <button class="see-all-btn" onclick="showSection('movies')">عرض الكل</button>
            </div>
            <div class="movie-grid" id="trendingGrid"></div>
        </section>

        <!-- Movies Section -->
        <section class="content-section" id="moviesSection">
            <div class="section-header">
                <h2 class="section-title">🎬 أحدث الأفلام</h2>
                <button class="see-all-btn" onclick="showSection('movies')">عرض الكل</button>
            </div>
            <div class="movie-grid" id="moviesGrid"></div>
        </section>

        <!-- Series Section -->
        <section class="content-section" id="seriesSection">
            <div class="section-header">
                <h2 class="section-title">📺 أحدث المسلسلات</h2>
                <button class="see-all-btn" onclick="showSection('series')">عرض الكل</button>
            </div>
            <div class="movie-grid" id="seriesGrid"></div>
        </section>

        <!-- Favorites Section -->
        <section class="content-section" id="favoritesSection" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">❤️ المفضلة</h2>
            </div>
            <div class="movie-grid" id="favoritesGrid"></div>
        </section>
    </main>

    <!-- Player Modal -->
    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <button class="close-btn" onclick="closePlayer()">✕</button>
            <h3 class="player-title" id="playerTitle"></h3>
            <button class="fav-btn" id="playerFavBtn" onclick="togglePlayerFavorite()">🤍</button>
        </div>
        
        <div class="server-tabs" id="serverTabs"></div>
        
        <div class="player-container">
            <iframe id="playerFrame" src="" frameborder="0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        </div>
        
        <div class="episode-selector" id="episodeSelector"></div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-container">
            <div class="admin-header">
                <h2>🔐 لوحة التحكم</h2>
                <button class="close-btn" onclick="closeAdminPanel()">✕</button>
            </div>
            
            <div id="adminLogin">
                <h3>تسجيل الدخول</h3>
                <input type="password" id="adminPassword" placeholder="كلمة المرور">
                <button class="btn-primary" onclick="adminLogin()">دخول</button>
            </div>
            
            <div id="adminContent" style="display: none;">
                <h3>إضافة محتوى جديد</h3>
                
                <div class="admin-form">
                    <input type="text" id="adminTitle" placeholder="عنوان العمل">
                    
                    <select id="adminType">
                        <option value="movie">فيلم</option>
                        <option value="series">مسلسل</option>
                    </select>
                    
                    <input type="text" id="adminPoster" placeholder="رابط البوستر">
                    <input type="text" id="adminBackdrop" placeholder="رابط الخلفية">
                    
                    <input type="text" id="adminServer1" placeholder="سيرفر 1">
                    <input type="text" id="adminServer2" placeholder="سيرفر 2">
                    <input type="text" id="adminServer3" placeholder="سيرفر 3">
                    <input type="text" id="adminServer4" placeholder="سيرفر 4">
                    <input type="text" id="adminServer5" placeholder="سيرفر 5">
                    
                    <input type="number" id="adminRating" placeholder="التقييم (0-10)" min="0" max="10" step="0.1">
                    
                    <label class="checkbox-label">
                        <input type="checkbox" id="adminHero">
                        <span>عرض في السلايدر الرئيسي</span>
                    </label>
                    
                    <button class="btn-primary" onclick="addContent()">➕ إضافة</button>
                </div>
                
                <h3>المحتوى الحالي</h3>
                <div id="adminContentList"></div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
