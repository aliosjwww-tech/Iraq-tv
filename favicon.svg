<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- خلفية دائرية فخمة -->
  <rect width="512" height="512" rx="110" fill="#0a0a0f"/>
  
  <!-- تأثير إضاءة خفيف بالخلفية -->
  <circle cx="256" cy="256" r="180" fill="#dc2626" opacity="0.15" filter="blur(20px)"/>

  <!-- هيكل الشاشة (التلفزيون) -->
  <rect x="80" y="120" width="352" height="230" rx="36" fill="#181824" stroke="#dc2626" stroke-width="12"/>
  
  <!-- أرجُل الشاشة -->
  <path d="M160 350 L120 410 M352 350 L392 410" stroke="#181824" stroke-width="14" stroke-linecap="round"/>

  <!-- شاشة التلفزيون المضيئة -->
  <rect x="106" y="146" width="300" height="178" rx="20" fill="#0f0f17"/>

  <!-- زر التشغيل أو الإضاءة -->
  <circle cx="256" cy="385" r="10" fill="#dc2626"/>

  <!-- نص IQ داخل الشاشة -->
  <text x="256" y="270" font-family="Arial, sans-serif" font-weight="900" font-size="95" fill="#ffffff" text-anchor="middle" letter-spacing="4">IQ</text>
  
  <!-- لمسة سينمائية (خط أحمر صغير أعلى الشاشة) -->
  <rect x="206" y="146" width="100" height="6" fill="#dc2626" rx="3"/>
</svg>
